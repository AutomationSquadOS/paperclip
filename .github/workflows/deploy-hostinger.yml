name: Deploy to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT: paperclip-live
      HEALTH_URL: http://srv1451461.hstgr.cloud:3100/api/health
    steps:
      - uses: actions/checkout@v5

      - name: Require the live auth secret
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ -z "${BETTER_AUTH_SECRET}" ]; then
            echo "::error::BETTER_AUTH_SECRET is not set. Set it to the secret the live board runs with; a new one would sign everyone out."
            exit 1
          fi

      - name: Record deploy start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: ${{ env.PROJECT }}
          docker-compose-path: docker/docker-compose.hostinger.yml
          environment-variables: |
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}

      - name: Wait for the build and health
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          START: ${{ steps.start.outputs.at }}
        run: |
          set -uo pipefail
          auth=( -H "Authorization: Bearer ${HOSTINGER_API_KEY}" -H "Accept: application/json" )
          logs_url="https://developers.hostinger.com/api/vps/v1/virtual-machines/${{ vars.HOSTINGER_VM_ID }}/docker/${PROJECT}/logs"

          build_lines() {
            curl -sS --connect-timeout 20 --max-time 60 "${auth[@]}" "$logs_url" -o /tmp/logs.json || return 0
            jq -r --arg start "$START" '
              .[]? | select(.service == "[build]") | .entries[]? | .line
              | select(.[0:19] >= $start)
            ' /tmp/logs.json 2>/dev/null || true
          }

          result=""
          for _ in $(seq 1 48); do
            lines="$(build_lines)"
            if printf '%s\n' "$lines" | grep -q "Project deployed successfully"; then
              result=deployed
              break
            fi
            if printf '%s\n' "$lines" | grep -Eqi "deployment failed|build failed"; then
              result=failed
              break
            fi
            sleep 15
          done
          printf '%s\n' "$(build_lines)" | tail -n 40

          if [ "$result" != deployed ]; then
            echo "::error::Hostinger did not finish deploying ${PROJECT} (result: ${result:-timeout})."
            jq -r '.[]? | select(.service != "[build]") | .service as $s | .entries[-30:][]? | "\($s): \(.line)"' /tmp/logs.json || true
            exit 1
          fi

          for _ in $(seq 1 24); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$HEALTH_URL"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "::error::The board did not answer ${HEALTH_URL} after deploy."
          curl -sS --connect-timeout 20 --max-time 60 "${auth[@]}" "$logs_url" -o /tmp/logs.json || true
          jq -r '.[]? | select(.service | startswith("server")) | .entries[-40:][]? | .line' /tmp/logs.json || true
          exit 1
